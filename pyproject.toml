[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==3.3.1",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[tool.uv]
python-preference = "only-system"
environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
override-dependencies = ["onnxruntime>=1.17,<1.19", "torch>=2.1,<2.3", "numpy<2"]
